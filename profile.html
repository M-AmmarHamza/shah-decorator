<!doctype html>
<html lang="en-PK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Account | Shah Decorator</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <main class="account-shell container">
      <header class="account-header">
        <a href="index.html">Shah Decorator</a>
        <button class="btn btn-primary" type="button" data-account-logout>
          Sign out
        </button>
      </header>
      <section class="account-welcome">
        <span class="eyebrow">Client Portal</span>
        <h1 data-account-name>Welcome</h1>
        <p>Manage your profile, saved event decor themes, and booking updates.</p>
      </section>
      <nav class="account-tabs">
        <button class="active" data-account-tab="orders">Bookings</button>
        <button data-account-tab="wishlist">Saved Themes</button>
        <button data-account-tab="profile">Profile</button>
      </nav>
      <section class="account-panel active" data-account-panel="orders">
        <div class="account-list" data-account-orders>
          <p>Loading bookings…</p>
        </div>
      </section>
      <section class="account-panel" data-account-panel="wishlist">
        <div class="account-list" data-account-wishlist>
          <p>Loading saved setups…</p>
        </div>
      </section>
      <section class="account-panel" data-account-panel="profile">
        <form class="account-form" data-account-form>
          <label>Full name<input class="field" name="fullName" required /></label>
          <label>Phone / WhatsApp number<input class="field" name="phone" /></label>
          <label>City / Preferred Venue<input class="field" type="text" name="avatarUrl" placeholder="e.g. Karachi" /></label>
          <button class="btn btn-primary" type="submit">Save Profile</button>
        </form>
      </section>
    </main>
    <script type="module" src="supabase-client.js"></script>
    <script type="module" src="profile.js"></script>
  </body>
</html>
